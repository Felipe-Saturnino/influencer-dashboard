# Configuração do Supabase (projeto local)
# Deploy exemplos: supabase functions deploy criar-usuario
#                   supabase functions deploy atualizar-perfil
#                   supabase functions deploy sync-rh-prestador-auth-user
#                   supabase functions deploy sync-spin-na-rede-rss

[functions.criar-usuario]
verify_jwt = false
# Evita 401 do gateway quando o browser envia o JWT — a função usa service_role internamente

[functions.recuperar-senha]
verify_jwt = false
# Reset de senha na tela de login (anon + service_role internamente)

[functions.atualizar-perfil]
verify_jwt = false
# Verificação de admin é feita manualmente dentro da função

[functions.admin-usuario-acao]
verify_jwt = false
# Desativar/ativar usuário e reset de senha (service_role); admin verificado na função

[functions.criar-usuario-scout]
verify_jwt = false
# Cria influencer a partir do Scout; usa service_role internamente

[functions.prospecto-scout-site]
verify_jwt = false
# Prospecto vindo do site (WordPress); valida PROSPECTO_SCOUT_FORM_SECRET e insere em scout_influencer

[functions.prospecto-afiliados-network-site]
verify_jwt = false
# Afiliado vindo do site; valida PROSPECTO_AFILIADOS_NETWORK_FORM_SECRET e insere em afiliados_network

[functions.criar-afiliado-network]
verify_jwt = false
# Cria utilizador afiliado + perfil a partir de afiliados_network (service_role internamente)

[functions.sync-rh-prestador-auth-user]
verify_jwt = false
# Sincroniza usuário prestador (Auth + profile + user_scopes) a partir de rh_funcionarios; permissão rh_funcionarios no corpo

[functions.sync-metricas-cda]
verify_jwt = false
# Integração CDA (Casa de Apostas): sync de métricas. Chamada pelo app e workflow diário.

[functions.trigger-social-kpis]
verify_jwt = false
# Dispara o workflow GitHub Actions Sync Social Media KPIs

[functions.relatorio-diario-diretoria]
verify_jwt = false
# Chamada pelo app (Status Técnico), GitHub Actions e cron; mesma superfície que sync (anon + service na função)

[functions.email-agenda-diaria]
verify_jwt = false
# Agenda do dia (operacional); destinatários em EMAIL_AGENDA_DESTINATARIOS

[functions.sync-spin-na-rede-rss]
verify_jwt = false

[functions.monitor-lobby-blaze]
verify_jwt = false
# Lobby Cassino Ao Vivo Blaze (API pública); grava lobby_monitor_* via service_role.

[functions.monitor-lobby-cda]
verify_jwt = false
# Lobby cassino CDA; ingest via body cda_categories (job Telecom). Grava lobby_monitor_* via service_role.

[functions.prestador-ponto]
verify_jwt = true
# Ingestão RSS → spin_na_rede_mencao (service role). Proteger com SPIN_NA_REDE_INGEST_SECRET ou Bearer service_role.

[functions.platform-health-check]
verify_jwt = false
# Diagnóstico Status Técnico; autorização admin/can_editar verificada dentro da função.

[functions.sync-comercial-spa-lista]
verify_jwt = false
# Import CSV oficial SPA/MF → comercial_empresas / comercial_marcas (service role interno).

[functions.validate-comercial-dominios]
verify_jwt = false
# Validação HTTP status_dominio das marcas Pipeline B2B (service role interno).

[functions.enrich-comercial-cnpj]
verify_jwt = false
# Enriquecimento cidade/UF por CNPJ em comercial_empresas (Brasil API; service role interno).

[functions.prospecto-cs-atendimento-site]
verify_jwt = false
# Formulário site Spin → cs_chamado_criar_site_spin

[functions.prospecto-vaga-candidatura-site]
verify_jwt = false
# Formulário Carreiras (multipart) → rh_vaga_candidaturas externas

[functions.ingest-cs-atendimento-outlook]
verify_jwt = false
# Ingestão e-mail contato@ via Microsoft Graph → cs_chamado_criar_email (cron / service_role).

[functions.sync-vagas-carreiras-site]
verify_jwt = false
# Snapshot diário vagas externas abertas → WordPress Carreiras (WORDPRESS_VAGAS_SYNC_URL + SPIN_VAGAS_SYNC_SECRET).
