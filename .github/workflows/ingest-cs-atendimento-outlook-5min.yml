# CS Atendimento Outlook — BACKUP / manual only.
# Agendamento PRINCIPAL: pg_cron no Supabase (scripts/setup-cs-atendimento-outlook-cron.sql).
#
# GitHub `schedule` é melhor esforço: em repos privados costuma atrasar horas ou pular
# runs (não use como cron de 5 min em produção).
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   CS_ATENDIMENTO_OUTLOOK_INGEST_SECRET (mesmo valor da Edge Function)
name: Ingest CS Atendimento Outlook (backup)

on:
  # A cada hora (UTC) — backup; não substitui pg_cron */5
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Invocar ingest-cs-atendimento-outlook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CS_ATENDIMENTO_OUTLOOK_INGEST_SECRET: ${{ secrets.CS_ATENDIMENTO_OUTLOOK_INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Secret SUPABASE_URL ausente (Settings → Secrets → Actions)."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY ausente (Settings → Secrets → Actions)."
            exit 1
          fi
          URL="${SUPABASE_URL%/}/functions/v1/ingest-cs-atendimento-outlook"
          BODY='{}'
          if [ -n "${CS_ATENDIMENTO_OUTLOOK_INGEST_SECRET:-}" ]; then
            BODY=$(printf '{"ingest_secret":"%s"}' "${CS_ATENDIMENTO_OUTLOOK_INGEST_SECRET}")
          fi
          echo "POST ${URL}"
          RES=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          HTTP=$(echo "$RES" | tail -n1)
          BODY_RES=$(echo "$RES" | sed '$d')
          echo "HTTP ${HTTP}"
          echo "$BODY_RES" | head -c 3000
          echo ""
          if [ "$HTTP" != "200" ]; then
            echo "::error::Falha HTTP ${HTTP}. Confira service_role, ingest_secret e Edge Function."
            exit 1
          fi
          OK=$(echo "$BODY_RES" | grep -oE '"ok"\s*:\s*(true|false)' | head -1 | grep -oE 'true|false' || true)
          if [ "$OK" != "true" ]; then
            echo "::error::Resposta com ok != true (Graph, secrets ou RPC)."
            exit 1
          fi
          echo "Ingestão CS Atendimento Outlook concluída com sucesso."
