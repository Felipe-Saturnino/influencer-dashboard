# Validação do frontend em PR e pushes às branches principais (TypeScript + build Vite).
# Não usa segredos: variáveis VITE_* são placeholders só para o bundler não falhar.

name: CI

on:
  push:
    branches: [main, master, staging]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
  pull_request:
    branches: [main, master, staging]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests & coverage (Vitest)
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Typecheck & production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder-key"

      - name: Bundle size budgets
        run: npm run check:bundle
