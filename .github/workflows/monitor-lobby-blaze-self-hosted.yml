# Monitor lobby Blaze — runner self-hosted (seu PC/servidor no Brasil).
# Instale o runner: GitHub → Settings → Actions → Runners → New self-hosted runner
# Depois: Actions → "Monitor Lobby Blaze (self-hosted)" → Run workflow
name: Monitor Lobby Blaze (self-hosted)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas simular (não grava no banco)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Buscar lobby Blaze e gravar snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Defina SUPABASE_URL nos secrets."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Defina SUPABASE_SERVICE_ROLE_KEY (recomendado)."
            exit 1
          fi
          ARGS=()
          if [ "${DRY_RUN:-}" = "1" ]; then ARGS+=(--dry-run); fi
          node scripts/monitor-lobby-blaze-run.mjs "${ARGS[@]}"
