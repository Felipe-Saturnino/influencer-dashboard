# Monitor lobby Blaze — fetch no runner (evita HTTP 451 na Edge) + gravação via Edge Function
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (recomendado) ou SUPABASE_ANON_KEY
name: Monitor Lobby Blaze (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas simular (não grava no banco)"
        type: boolean
        default: false

concurrency:
  group: monitor-lobby-blaze-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Horário da execução (UTC e Brasília)
        run: |
          echo "UTC:      $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Brasília: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Buscar lobby Blaze e gravar snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Defina SUPABASE_URL nos secrets do repositório."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Defina SUPABASE_SERVICE_ROLE_KEY (recomendado) ou SUPABASE_ANON_KEY."
            exit 1
          fi
          ARGS=()
          if [ "${DRY_RUN:-}" = "1" ]; then
            ARGS+=(--dry-run)
          fi
          node scripts/monitor-lobby-blaze-run.mjs "${ARGS[@]}"
