# Monitor lobby Blaze — posição das mesas Spin (Cassino Ao Vivo)
# A cada hora (UTC). Ajuste o cron se quiser alinhar a hora cheia em Brasília.
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (ou SERVICE_ROLE_KEY se configurado no projeto)
name: Monitor Lobby Blaze (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-lobby-blaze-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Horário da execução (UTC e Brasília)
        run: |
          echo "UTC:      $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Brasília: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Invocar monitor-lobby-blaze
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Defina SUPABASE_URL e SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
          URL="${SUPABASE_URL%/}/functions/v1/monitor-lobby-blaze"
          RES=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          HTTP=$(echo "$RES" | tail -n1)
          BODY=$(echo "$RES" | sed '$d')
          echo "HTTP ${HTTP}"
          echo "$BODY" | head -c 4000
          echo ""
          if [ "$HTTP" != "200" ]; then
            exit 1
          fi
          OK=$(echo "$BODY" | grep -oE '"ok"\s*:\s*(true|false)' | head -1 | grep -oE 'true|false' || true)
          STATUS=$(echo "$BODY" | grep -oE '"status"\s*:\s*"[^"]+"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/' || true)
          if [ "$OK" != "true" ] && [ "$STATUS" != "parcial" ]; then
            echo "Job retornou ok=false e status=${STATUS:-desconhecido}"
            exit 1
          fi
          echo "Monitor lobby Blaze concluído (status=${STATUS:-ok})."
