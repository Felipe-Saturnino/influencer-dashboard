# Recupera jobs que AINDA dependem do schedule do GitHub (ex.: Social KPIs / Python).
# Jobs Edge (CDA, e-mails, RSS, Comercial) usam pg_cron no Supabase — NÃO re-disparar aqui
# (evitar e-mail duplicado). Ver scripts/COLE-NO-SUPABASE-daily-edge-jobs-pg-cron.sql
#
# Vários horários: o próprio schedule do GitHub também falha; mais tentativas = mais chance.
name: Daily jobs watchdog (BRT)

on:
  schedule:
    # ~8h BRT — Social já deveria ter rodado ~6h30; CDA/e-mails já via pg_cron
    - cron: "0 11 * * *"
    # ~9h30 BRT
    - cron: "30 12 * * *"
    # ~12h BRT — última rede de segurança do dia
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  recover-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Re-disparar workflows GitHub sem sucesso hoje (Brasília)
        uses: actions/github-script@v7
        with:
          script: |
            const TZ = "America/Sao_Paulo";
            const hojeBr = new Date().toLocaleDateString("en-CA", { timeZone: TZ });

            // Só o que ainda depende do schedule do GitHub (ETL Python).
            // Edge diários = pg_cron — fora desta lista.
            const workflows = [
              { id: "sync-social-kpis-daily.yml", label: "Social KPIs" },
            ];

            const { owner, repo } = context.repo;
            const dispatched = [];
            const skipped = [];
            const inFlight = [];

            for (const w of workflows) {
              const { data: completed } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: w.id,
                status: "completed",
                per_page: 15,
              });

              const okHoje = (completed.workflow_runs || []).some((run) => {
                if (run.conclusion !== "success") return false;
                const dia = new Date(run.created_at).toLocaleDateString("en-CA", { timeZone: TZ });
                return dia === hojeBr;
              });

              if (okHoje) {
                skipped.push(w.label);
                continue;
              }

              const { data: active } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: w.id,
                per_page: 5,
              });

              const runningHoje = (active.workflow_runs || []).some((run) => {
                if (!["queued", "in_progress", "waiting", "pending", "requested"].includes(run.status)) {
                  return false;
                }
                const dia = new Date(run.created_at).toLocaleDateString("en-CA", { timeZone: TZ });
                return dia === hojeBr;
              });

              if (runningHoje) {
                inFlight.push(w.label);
                continue;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: w.id,
                ref: "main",
              });
              dispatched.push(w.label);
            }

            await core.summary
              .addHeading(`Watchdog ${hojeBr} (${TZ})`, 3)
              .addRaw(`- Re-disparados: ${dispatched.length ? dispatched.join(", ") : "nenhum"}`, true)
              .addRaw(`- Já OK hoje: ${skipped.length ? skipped.join(", ") : "nenhum"}`, true)
              .addRaw(`- Em andamento: ${inFlight.length ? inFlight.join(", ") : "nenhum"}`, true)
              .addRaw(`- Edge diários (CDA/e-mails/RSS/Comercial): pg_cron Supabase — fora deste watchdog`, true)
              .write();
