# E-mail Agenda do dia — manual / backup no GitHub Actions.
# Agendamento PRINCIPAL: pg_cron (~6h10 BRT) — COLE-NO-SUPABASE-daily-edge-jobs-pg-cron.sql
# NÃO reativar schedule aqui: duplicaria e-mail com o pg_cron.
#
# Secrets GitHub (manual): SUPABASE_URL, SUPABASE_ANON_KEY
# Destinatários: EMAIL_AGENDA_DESTINATARIOS nos Secrets do Supabase.

name: E-mail Agenda Diária (6h BRT)

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: email-agenda-diaria-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Horário da execução (UTC e Brasília)
        run: |
          echo "UTC:      $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Brasília: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Enviar e-mail de agenda
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL e SUPABASE_ANON_KEY devem estar configurados"
            exit 1
          fi
          RES=$(curl -s -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/functions/v1/email-agenda-diaria" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{}")
          HTTP=$(echo "$RES" | tail -n1)
          BODY=$(echo "$RES" | sed '$d')
          echo "HTTP $HTTP"
          echo "$BODY"
          if [ "$HTTP" != "200" ]; then
            exit 1
          fi
